# Spring Boot脚手架自动生成的
spring.application.name=SpringBoot11

spring.config.import=classpath:application-mysql.properties,classpath:application-mybatis.properties,classpath:application-redis.properties

# 全局根日志记录器,影响所有未单独配置的包和类
logging.level.root=info

#日志文件将被生成到当前工作目录下的log目录，并且在该目录下生成my.log文件
logging.file.name=./logs/my.log